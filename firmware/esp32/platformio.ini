; PredictIQ ESP32-S3 — Real-Hardware Firmware (Phase 7)
;
; Builds the real-hardware firmware at firmware/esp32/ for an ESP32-S3 board.
; This is the REAL_HARDWARE path (source == REAL_HARDWARE). The Wokwi/simulator
; path lives in firmware/wokwi/ (separate config).
;
; Secrets: none in this file. Wi-Fi credentials are intentionally placeholder
; strings in config.h; set them per-device via build_flags or edit config.h for
; LAN development. Never commit real credentials.

; Sources live at the environment root (predict_iq_esp32.ino + drivers), not in
; a src/ subfolder — point PlatformIO at them so `pio run` actually compiles.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Libraries: ArduinoWiFi, HTTPClient, and ArduinoJson are used.
; ArduinoJson is fetched by PlatformIO from the library registry.
lib_deps =
    bblanchon/ArduinoJson@^6.21.0

; Build flags that can override config.h constants per device. Uncomment and
; set real values only in private CI/runtime env, never committed.
; build_flags =
;   -D WIFI_SSID=\"${WIFI_SSID}\"
;   -D WIFI_PASSWORD=\"${WIFI_PASSWORD}\"
;   -D DEVICE_ID=\"ESP32_REAL_002\"
;   -D MACHINE_ID=\"M002\"
;   -D API_BASE_URL=\"http://192.168.1.100:8000\"

; Optional: enable for fully offline dev only. NOT for deployed operation.
;   -D SKIP_NTP_GATE=1
