[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; TLS test flag: uncomment to bypass certificate validation for tunnels whose
; certificates the ESP32 trust store cannot verify (test builds ONLY, never
; deployment). See src/config.h.
; build_flags = -D TLS_ALLOW_INSECURE

; Write-gate credential (X-API-Key) for telemetry/heartbeat POSTs. Supplied at
; build time from the local environment - the secret NEVER enters this tracked
; file. The build command must set the variable to the SAME key the backend uses
; (DEVICE_API_KEY in deploy/.env), e.g.:
;   DEVICE_API_KEY=<real key> pio run -e esp32-s3-devkitc-1
; A build without the variable compiles the key as an empty string, which keeps
; config.h's #ifndef guard effective: the firmware then omits the X-API-Key
; header and the backend rejects writes with 401 (fail-closed).
build_flags =
  -DDEVICE_API_KEY=\"${sysenv.DEVICE_API_KEY}\"
  -DGATEWAY_TOKEN=\"${sysenv.GATEWAY_TOKEN}\"

monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit MPU6050@^2.2.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  bblanchon/ArduinoJson@^7.3.0
