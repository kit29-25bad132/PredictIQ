<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" filter="url(#glow)" />

  <!-- Radio / Pulse IoT Antenna Icon in dark industrial color -->
  <g transform="translate(14, 14)" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center antenna dot -->
    <circle cx="18" cy="18" r="2.8" fill="#020617" stroke="none" />
    <!-- Inner waves -->
    <path d="M12.5 12.5a7.8 7.8 0 0 1 11 0" />
    <path d="M23.5 23.5a7.8 7.8 0 0 1-11 0" />
    <!-- Outer waves -->
    <path d="M8 8a14.2 14.2 0 0 1 20 0" />
    <path d="M28 28a14.2 14.2 0 0 1-20 0" />
  </g>
</svg>
