# PredictIQ Deployment (Phase 8)
#
# Complete deployment stack for PredictIQ V1 platform.
#
# Services:
#   - frontend: React/Vite dashboard served by Node.js
#   - backend: FastAPI backend with PostgreSQL
#   - database: PostgreSQL database (persistent volume)
#
# Secrets: all injected via .env (gitignored) or runtime environment.
# No credentials are committed or hardcoded.
#
# Network: services communicate on an internal Docker network.
# The frontend reaches the backend via the service name "backend" on port 8000.

services:
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Runtime /api proxy target. The Vite bundle is built WITHOUT an API URL
      # (VITE_API_URL is build-time-only and cannot be changed after build);
      # the Node server proxies same-origin /api requests to this origin.
      BACKEND_ORIGIN: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - predictiq-network

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database connection - required
      DATABASE_URL: "${DATABASE_URL}"
      # libpq sslmode: the local compose PostgreSQL runs WITHOUT TLS, so this
      # must be "disable" for the local stack. Managed/remote databases should
      # override to "require" in their own environment. Never silently weaken
      # a production connection: the backend default (config.py) is "require".
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      # Application settings
      APP_ENV: "${APP_ENV:-production}"
      # Device API key for write-gate authentication (optional in dev)
      DEVICE_API_KEY: "${DEVICE_API_KEY:-}"
      # CORS origins - comma-separated list (empty = no browser CORS)
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - predictiq-network

  database:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USER:-predictiq}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_in_production}"
      POSTGRES_DB: "${DB_NAME:-predictiq}"
    volumes:
      # Persistent database storage
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-predictiq} -d ${DB_NAME:-predictiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predictiq-network

volumes:
  postgres_data:
    name: predictiq-postgres-data

networks:
  predictiq-network:
    driver: bridge
