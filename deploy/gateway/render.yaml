services:
  - type: web
    name: predictiq-gateway
    runtime: docker
    dockerfilePath: deploy/gateway/Dockerfile
    dockerContext: deploy/gateway
    envVars:
      - key: RENDER_BACKEND_URL
        value: https://predictiq-backend-771t.onrender.com
      - key: RENDER_DEVICE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GATEWAY_TOKEN
        generateValue: true  # Render generates a secure value
      - key: ALLOWED_DEVICES
        value: ESP32_001
      - key: ALLOWED_MACHINES
        value: TEST-001
      - key: MAX_REQUEST_BYTES
        value: 8192
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
      - key: UPSTREAM_TIMEOUT_SECONDS
        value: "10.0"
      - key: PORT
        value: "9000"
    healthCheckPath: /health
    autoDeploy: false
